# Flowis+ ECO CC1101 hardware packet-mode diagnostic test.
# This config uses a local-to-this-repository external component override
# based on ESPHome 2026.10.2. It does NOT load the rtl433: pulse decoder.
#
# Keep the existing Wi-Fi secrets in your Home Assistant ESPHome config.

external_components:
  - source:
      type: git
      url: https://github.com/ScApi/esphome_rtl433
      ref: experiment/flowis-cc1101-packet-diagnostics
      path: ha-external-components
    components: [cc1101]

# Flowis+ ECO hardware-packet-mode test
# ESPHome 2026.10.2+; loads a diagnostic override of the native cc1101 component.
#
# IMPORTANT:
# Do NOT add the separate "rtl433:" component or the repository's
# components/rtl433 external component. The ha-external-components/cc1101
# source above replaces ESPHome's bundled cc1101 component; it is not a
# second radio driver, so only this one component owns the CC1101 SPI device.
#
# Existing wiring (ESP32-WROOM-32, VSPI):
# CC1101 CSN  -> GPIO5
# CC1101 GDO0 -> GPIO4
# CC1101 SCK  -> GPIO18
# CC1101 MISO -> GPIO19
# CC1101 MOSI -> GPIO23
# CC1101 GDO2 is not used by ESPHome's native packet-mode component.
# VCC -> 3.3 V, GND -> GND

esphome:
  name: flowis-rtl433-868
  friendly_name: Flowis RTL433 868

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

spi:
  clk_pin: GPIO18
  miso_pin: GPIO19
  mosi_pin: GPIO23

# Native ESPHome CC1101 packet mode.
# Settings copied from the successful v24.C.11 report in rtl_433 issue #2317.
cc1101:
  cs_pin: GPIO5
  gdo0_pin: GPIO4

  frequency: 868.04MHz
  modulation_type: 2-FSK
  symbol_rate: 100000
  fsk_deviation: 50kHz
  filter_bandwidth: 325kHz
  if_frequency: 203kHz

  sync_mode: 30/32
  sync1: 0xD3
  sync0: 0x91

  packet_mode: true
  packet_length: 0       # variable-length packets
  crc_enable: true
  # whitening and Manchester decoding remain disabled (ESPHome defaults).

  on_packet:
    - lambda: |-
        // ESPHome's native CC1101 component removes the variable-length
        // prefix before invoking on_packet. With CRC enabled, only packets
        // that pass the CC1101 hardware CRC check reach this callback.
        char hex[64 * 3 + 1] = {};
        size_t used = 0;
        for (size_t i = 0; i < x.size() && used < sizeof(hex); ++i) {
          int written = snprintf(
            hex + used, sizeof(hex) - used,
            i == 0 ? "%02X" : " %02X",
            static_cast<unsigned>(x[i])
          );
          if (written < 0 || static_cast<size_t>(written) >= sizeof(hex) - used) {
            break;
          }
          used += static_cast<size_t>(written);
        }

        const char *type = "unknown";
        if (!x.empty()) {
          if (x[0] == 0x01) {
            type = "type-1";
          } else if (x[0] == 0x02) {
            type = "type-2";
          }
        }

        ESP_LOGI(
          "flowis_pkt",
          "RX type=%s len=%u CRC=OK RSSI=%.1f dBm FREQEST=%+.0f Hz LQI=%u DATA=[%s]",
          type,
          static_cast<unsigned>(x.size()),
          rssi,
          freq_offset,
          static_cast<unsigned>(lqi),
          hex
        );
