# Flowis+ ECO4 decoder example for ESPHome 2026.10.2+
#
# Copy the sensor: and text_sensor: sections into your existing flowis.yaml.
# Replace ONLY the cc1101.on_packet lambda with the one below.
# Keep your current Wi-Fi/API/OTA/SPI configuration.
#
# Verified radio settings from the successful reception test:
# 868.00 MHz, 2-FSK, 100 kbaud, 50 kHz deviation, 325 kHz RX bandwidth,
# 203 kHz IF, D391 sync 30/32, variable packet length, hardware CRC enabled.
#
# The decoder accepts only meter ID 241047300 and valid packet lengths:
# Type 1 = 25 data bytes, Type 2 = 19 data bytes.
# The callback receives packets only after hardware CRC acceptance
# when crc_enable: true is configured.

external_components:
  - source:
      type: git
      url: https://github.com/ScApi/esphome_rtl433
      ref: experiment/flowis-cc1101-packet-diagnostics
      path: ha-external-components
    components: [cc1101]
    refresh: 0s

esphome:
  name: flowis-rtl433-868
  friendly_name: Flowis RTL433 868

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

spi:
  clk_pin: GPIO18
  miso_pin: GPIO19
  mosi_pin: GPIO23

sensor:
  # Type 1: cumulative meter register, litres -> m³.
  - platform: template
    id: flowis_total_m3
    name: "Flowis stan calkowity"
    device_class: water
    state_class: total_increasing
    unit_of_measurement: "m³"
    accuracy_decimals: 3
    update_interval: never

  # Type 1: previous-month-end cumulative meter register (not monthly use).
  - platform: template
    id: flowis_previous_month_end_total_m3
    name: "Flowis stan na koniec poprzedniego miesiaca"
    device_class: water
    state_class: measurement
    unit_of_measurement: "m³"
    accuracy_decimals: 3
    update_interval: never

  # Type 1: calculated monthly use = current total - previous-month-end total.
  # Diagnostic cross-check against Type 2 current-month value.
  - platform: template
    id: flowis_month_current_check_m3
    name: "Flowis biezacy miesiac kontrola"
    device_class: water
    state_class: measurement
    unit_of_measurement: "m³"
    accuracy_decimals: 3
    update_interval: never

  # Type 2: rolling seven-month history. Index 0 is current month.
  - platform: template
    id: flowis_month_0_m3
    name: "Flowis zuzycie biezacy miesiac"
    device_class: water
    state_class: measurement
    unit_of_measurement: "m³"
    accuracy_decimals: 3
    update_interval: never

  - platform: template
    id: flowis_month_1_m3
    name: "Flowis zuzycie poprzedni miesiac"
    device_class: water
    state_class: measurement
    unit_of_measurement: "m³"
    accuracy_decimals: 3
    update_interval: never

  - platform: template
    id: flowis_month_2_m3
    name: "Flowis zuzycie 2 miesiace temu"
    device_class: water
    state_class: measurement
    unit_of_measurement: "m³"
    accuracy_decimals: 3
    update_interval: never

  - platform: template
    id: flowis_month_3_m3
    name: "Flowis zuzycie 3 miesiace temu"
    device_class: water
    state_class: measurement
    unit_of_measurement: "m³"
    accuracy_decimals: 3
    update_interval: never

  - platform: template
    id: flowis_month_4_m3
    name: "Flowis zuzycie 4 miesiace temu"
    device_class: water
    state_class: measurement
    unit_of_measurement: "m³"
    accuracy_decimals: 3
    update_interval: never

  - platform: template
    id: flowis_month_5_m3
    name: "Flowis zuzycie 5 miesiecy temu"
    device_class: water
    state_class: measurement
    unit_of_measurement: "m³"
    accuracy_decimals: 3
    update_interval: never

  - platform: template
    id: flowis_month_6_m3
    name: "Flowis zuzycie 6 miesiecy temu"
    device_class: water
    state_class: measurement
    unit_of_measurement: "m³"
    accuracy_decimals: 3
    update_interval: never

  - platform: template
    id: flowis_rssi_dbm
    name: "Flowis RSSI"
    unit_of_measurement: "dBm"
    accuracy_decimals: 1
    update_interval: never

  - platform: template
    id: flowis_lqi
    name: "Flowis LQI"
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: flowis_backflow_raw
    name: "Flowis backflow raw"
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: flowis_alarm_raw
    name: "Flowis alarm raw"
    accuracy_decimals: 0
    update_interval: never

text_sensor:
  - platform: template
    id: flowis_meter_id
    name: "Flowis numer licznika"
    update_interval: never

  - platform: template
    id: flowis_meter_time
    name: "Flowis czas licznika"
    update_interval: never

cc1101:
  cs_pin: GPIO5
  gdo0_pin: GPIO4

  frequency: 868.00MHz
  modulation_type: 2-FSK
  symbol_rate: 100000
  fsk_deviation: 50kHz
  filter_bandwidth: 325kHz
  if_frequency: 203kHz

  sync_mode: 30/32
  sync1: 0xD3
  sync0: 0x91

  packet_mode: true
  packet_length: 0
  crc_enable: true

  on_packet:
    - lambda: |-
        // The CC1101 component has already removed the variable-length byte.
        // With crc_enable: true, on_packet is called only for CRC-accepted frames.
        if (!((x.size() == 25 && x[0] == 0x01) ||
              (x.size() == 19 && x[0] == 0x02))) {
          ESP_LOGW("flowis_decode", "Unexpected Flowis frame: type=0x%02X len=%u",
                   x.empty() ? 0 : static_cast<unsigned>(x[0]),
                   static_cast<unsigned>(x.size()));
          return;
        }

        // The serial is little-endian in bytes 1..4.
        const uint32_t meter_id =
            static_cast<uint32_t>(x[1]) |
            (static_cast<uint32_t>(x[2]) << 8) |
            (static_cast<uint32_t>(x[3]) << 16) |
            (static_cast<uint32_t>(x[4]) << 24);

        // Ignore transmissions from other nearby Flowis meters.
        constexpr uint32_t EXPECTED_METER_ID = 241047300UL;
        if (meter_id != EXPECTED_METER_ID) {
          ESP_LOGW("flowis_decode", "Ignoring other meter ID=%lu",
                   static_cast<unsigned long>(meter_id));
          return;
        }

        char meter_id_text[16] = {};
        snprintf(meter_id_text, sizeof(meter_id_text), "%lu",
                 static_cast<unsigned long>(meter_id));
        id(flowis_meter_id).publish_state(meter_id_text);
        id(flowis_rssi_dbm).publish_state(rssi);
        id(flowis_lqi).publish_state(static_cast<float>(lqi));

        if (x[0] == 0x01) {
          // Type 1, 25 bytes:
          // x[6..9] packed device time; x[10..12] total litres;
          // x[13] backflow raw, x[14] alarm raw;
          // x[21..24] previous-month-end cumulative litres.
          const uint32_t total_litres =
              static_cast<uint32_t>(x[10]) |
              (static_cast<uint32_t>(x[11]) << 8) |
              (static_cast<uint32_t>(x[12]) << 16);

          const uint32_t previous_month_end_litres =
              static_cast<uint32_t>(x[21]) |
              (static_cast<uint32_t>(x[22]) << 8) |
              (static_cast<uint32_t>(x[23]) << 16) |
              (static_cast<uint32_t>(x[24]) << 24);

          // Never publish a zero or an impossible backwards reading as a replacement.
          if (total_litres > 0) {
            id(flowis_total_m3).publish_state(
                static_cast<float>(total_litres) / 1000.0f);
          }

          if (previous_month_end_litres > 0) {
            id(flowis_previous_month_end_total_m3).publish_state(
                static_cast<float>(previous_month_end_litres) / 1000.0f);
          }

          if (previous_month_end_litres > 0 &&
              total_litres >= previous_month_end_litres) {
            const uint32_t monthly_litres =
                total_litres - previous_month_end_litres;
            id(flowis_month_current_check_m3).publish_state(
                static_cast<float>(monthly_litres) / 1000.0f);
          }

          id(flowis_backflow_raw).publish_state(static_cast<float>(x[13]));
          id(flowis_alarm_raw).publish_state(static_cast<float>(x[14]));

          // Decode the packed device timestamp using the Flowis bit layout.
          const uint8_t second = x[6] & 0x3F;
          const uint8_t minute = ((x[7] & 0x0F) << 2) | ((x[6] & 0xC0) >> 6);
          const uint8_t hour = (x[7] >> 4) | ((x[8] & 0x01) << 4);
          const uint8_t day = (x[8] & 0x3E) >> 1;
          const uint8_t month = (x[8] >> 6) | ((x[9] & 0x03) << 2);
          const uint16_t year = 2000 + (x[9] >> 2);

          if (month >= 1 && month <= 12 && day >= 1 && day <= 31 &&
              hour <= 23 && minute <= 59 && second <= 59) {
            char device_time[24] = {};
            snprintf(device_time, sizeof(device_time),
                     "%04u-%02u-%02u %02u:%02u:%02u",
                     static_cast<unsigned>(year),
                     static_cast<unsigned>(month),
                     static_cast<unsigned>(day),
                     static_cast<unsigned>(hour),
                     static_cast<unsigned>(minute),
                     static_cast<unsigned>(second));
            id(flowis_meter_time).publish_state(device_time);
          }

          ESP_LOGI("flowis_decode",
                   "TYPE1 meter=%lu total=%.3f m3 prev_month_end=%.3f m3 month_check=%.3f m3 RSSI=%.1f dBm backflow_raw=%u alarm_raw=%u",
                   static_cast<unsigned long>(meter_id),
                   static_cast<double>(total_litres) / 1000.0,
                   static_cast<double>(previous_month_end_litres) / 1000.0,
                   previous_month_end_litres > 0 && total_litres >= previous_month_end_litres
                     ? static_cast<double>(total_litres - previous_month_end_litres) / 1000.0
                     : -1.0,
                   static_cast<double>(rssi),
                   static_cast<unsigned>(x[13]),
                   static_cast<unsigned>(x[14]));
        } else {
          // Type 2, 19 bytes:
          // x[5..18] = seven uint16 little-endian monthly values in litres.
          // Index 0 is the current calendar month, then six preceding months.
          for (size_t i = 0; i < 7; i++) {
            const size_t pos = 5 + (i * 2);
            const uint16_t litres =
                static_cast<uint16_t>(x[pos]) |
                (static_cast<uint16_t>(x[pos + 1]) << 8);

            // 0xFFFF is an unavailable/special value, not 65.535 m3.
            // Skip it so the last valid sensor state is retained.
            if (litres == 0xFFFF) {
              ESP_LOGW("flowis_decode", "TYPE2 month[%u] unavailable (0xFFFF)",
                       static_cast<unsigned>(i));
              continue;
            }

            const float amount_m3 = static_cast<float>(litres) / 1000.0f;
            switch (i) {
              case 0: id(flowis_month_0_m3).publish_state(amount_m3); break;
              case 1: id(flowis_month_1_m3).publish_state(amount_m3); break;
              case 2: id(flowis_month_2_m3).publish_state(amount_m3); break;
              case 3: id(flowis_month_3_m3).publish_state(amount_m3); break;
              case 4: id(flowis_month_4_m3).publish_state(amount_m3); break;
              case 5: id(flowis_month_5_m3).publish_state(amount_m3); break;
              case 6: id(flowis_month_6_m3).publish_state(amount_m3); break;
            }

            ESP_LOGI("flowis_decode", "TYPE2 meter=%lu month[%u]=%.3f m3 RSSI=%.1f dBm",
                     static_cast<unsigned long>(meter_id),
                     static_cast<unsigned>(i),
                     static_cast<double>(amount_m3),
                     static_cast<double>(rssi));
          }
        }
