# Flowis ESPHome RTL433 gateway — ESP32 + CC1101, 868 MHz FSK
# Install this file in ESPHome and replace Wi-Fi/API details using your secrets.

esphome:
  name: flowis-rtl433-868
  friendly_name: Flowis RTL433 868

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      type: git
      url: https://github.com/ScApi/esphome_rtl433.git
      ref: flowis-868-fsk
    components: [rtl433]

# Existing Flowis wiring (ESP32 VSPI):
# CC1101 CSN  -> GPIO5
# CC1101 GDO0 -> GPIO4
# CC1101 GDO2 -> GPIO27
# CC1101 SCK  -> GPIO18
# CC1101 MISO -> GPIO19
# CC1101 MOSI -> GPIO23
# VCC -> 3.3 V, GND -> GND

rtl433:
  cs_pin: 5
  gdo0_pin: 4
  gdo2_pin: 27
  clk_pin: 18
  miso_pin: 19
  mosi_pin: 23

  frequency: 868.00
  modulation: FSK
  bitrate: 100
  deviation: 50
  rx_bandwidth: 325
  min_pulse_length: 5  # microseconds; capture short Flowis+ FSK pulses

  # Start with the same receive/debug approach as the Flowis tests.
  min_rssi: -82
  rssi_threshold_delta: 9
  rssi_samples: 50000
  auto_rssi_threshold: true
  publish_unparsed: true
  deaf_workaround: true
  log_module_status: true
  rtl_debug: 1

  on_message:
    - lambda: |-
        ESP_LOGI("rtl433", "RF message: %s", x.c_str());
